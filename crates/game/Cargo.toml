[package]
name = "game"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "block-game"

[[bin]]
name = "block-game"
path = "src/main.rs"

[dependencies]
bevy.workspace = true
fastnoise-lite = "1.1.1"
# PNG writing for the creature_skins tool (Bevy already builds it).
image = { version = "0.25", default-features = false, features = ["png"] }
lz4_flex = "0.11"
ron = "0.10"
serde = { workspace = true, features = ["derive"] }
voxel.workspace = true
worldgen.workspace = true

[features]
# `cargo run --features dev` links Bevy dynamically for much faster rebuilds, and
# reloads assets (creature skins, ...) when you save them.
dev = ["bevy/dynamic_linking", "bevy/file_watcher"]
# `cargo run --release --features trace` streams profiling data to Tracy.
trace = ["bevy/trace_tracy"]
